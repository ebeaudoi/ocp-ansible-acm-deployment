apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openshift-gitops

resources:
  - ../../base

components:
  - ../../components/annotation-resource-tracking
  - ../../components/edge-termination
  - ../../components/enable-notifications
  - ../../components/gitops-admins
  - ../../components/health-check-olm
  - ../../components/health-check-openshift-builds

# Edit gitops-admins-group.yaml to add OpenShift users who should admin Argo CD.
# Until then the Group has users: [] and humans cannot admin via that group.
patches:
  - path: gitops-admins-group.yaml
    target:
      kind: Group
      name: gitops-admins

# Full RHACM stack for air-gapped clusters: operator + MultiClusterHub + observability.
#
# Prerequisite (if including observability): object storage credentials ready
# (see observability/base/01-object-storage-config.yaml), or deploy without
# observability via: ansible-playbook deploy.yaml -e deploy_observability=false
#

# First-time install (repo root): ansible-playbook deploy.yaml -e rhacm_overlay=airgapped
# Subscription uses Manual InstallPlan approval; deploy.yaml auto-approves on first install.
#
# Re-apply after CRDs exist:
#   oc apply -k overlays/airgapped/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../operator/overlays/airgapped
  - ../../instance/overlays/airgapped
  - ../../observability/overlays/airgapped

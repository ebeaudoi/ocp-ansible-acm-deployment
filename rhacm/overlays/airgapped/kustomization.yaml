# Full RHACM stack for air-gapped clusters: operator + MultiClusterHub + observability.
#
# Prerequisite: S4 must already be deployed (namespace s4, secret s4-credentials).
#
# First-time install: ansible-playbook deploy-rhacm.yaml -e rhacm_overlay=airgapped
# InstallPlan approval is Manual — the script pauses for approval when needed.
#
# Re-apply after CRDs exist:
#   oc apply -k overlays/airgapped/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../operator/overlays/airgapped
  - ../../instance/overlays/airgapped
  - ../../observability/overlays/airgapped

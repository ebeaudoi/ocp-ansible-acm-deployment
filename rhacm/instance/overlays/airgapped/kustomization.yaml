apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
- target:
    kind: MultiClusterHub
    name: multiclusterhub
  patch: |-
    - op: replace
      path: /metadata/annotations/installer.open-cluster-management.io~1mce-subscription-spec
      value: '{"source": "ebdn-redhat-operators"}'

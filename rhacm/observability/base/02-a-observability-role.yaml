apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observability-setup
  namespace: open-cluster-management-observability
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - create
  - patch
  - update
- apiGroups:
  - objectbucket.io
  resources:
  - objectbucketclaims
  verbs:
  - get
  - list

# Role to read the object-storage credentials Secret.
# Namespace and resourceNames must match OBJSTORE_NAMESPACE / OBJSTORE_SECRET_NAME
# in 01-object-storage-config.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observability-setup-object-storage-credentials
  namespace: s4
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - s4-credentials
  verbs:
  - get

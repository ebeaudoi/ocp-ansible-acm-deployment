apiVersion: observability.open-cluster-management.io/v1beta2
kind: MultiClusterObservability
metadata:
  name: observability
spec:
  enableDownsampling: true
  imagePullPolicy: IfNotPresent
  imagePullSecret: multiclusterhub-operator-pull-secret
  nodeSelector:
    node-role.kubernetes.io/infra: ""
  tolerations:
  - key: node-role.kubernetes.io/infra
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/infra
    operator: Exists
    effect: NoExecute
  observabilityAddonSpec:
    enableMetrics: true
    interval: 300
  storageConfig:
    # Object store: S4 S3 (thanos-object-storage Secret from observability-setup Job)
    alertmanagerStorageSize: 1Gi
    compactStorageSize: 100Gi
    metricObjectStorage:
      key: thanos.yaml
      name: thanos-object-storage
    receiveStorageSize: 100Gi
    ruleStorageSize: 1Gi
    # Block PVC StorageClass for stateful components (cluster default if omitted).
    # Patch in an overlay if your cluster default is unsuitable.
    storeStorageSize: 10Gi

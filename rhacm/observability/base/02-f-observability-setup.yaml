apiVersion: batch/v1
kind: Job
metadata:
  name: observability-setup
  namespace: open-cluster-management-observability
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: observability-setup
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      nodeSelector:
        node-role.kubernetes.io/infra: ""
      tolerations:
      - key: node-role.kubernetes.io/infra
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/infra
        operator: Exists
        effect: NoExecute
      containers:
      - name: observability-setup
        image: patch-me-see-overlays-dir
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: s4-thanos-config
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "Define pull-secret for MultiClusterObservability"
          DOCKER_CONFIG_JSON=$(oc extract secret/pull-secret -n openshift-config --to=-)
          oc create secret generic multiclusterhub-operator-pull-secret \
            -n open-cluster-management-observability \
            --from-literal=.dockerconfigjson="${DOCKER_CONFIG_JSON}" \
            --type=kubernetes.io/dockerconfigjson \
            --dry-run=client -o yaml | oc apply -f -

          echo "Wait for S4 credentials Secret ${S4_NAMESPACE}/${S4_SECRET_NAME}"
          ATTEMPTS=0
          MAX_ATTEMPTS=60
          while ! oc get secret "${S4_SECRET_NAME}" -n "${S4_NAMESPACE}" >/dev/null 2>&1; do
            if [[ ${ATTEMPTS} -ge ${MAX_ATTEMPTS} ]]; then
              echo "Timed out waiting for ${S4_NAMESPACE}/${S4_SECRET_NAME}. Deploy S4 first (s4/deploy-s4.yaml)." >&2
              exit 1
            fi
            echo "Waiting for S4 secret (attempt $((ATTEMPTS + 1))/${MAX_ATTEMPTS})"
            sleep 5
            ATTEMPTS=$((ATTEMPTS + 1))
          done

          ACCESS_KEY=$(oc get secret "${S4_SECRET_NAME}" -n "${S4_NAMESPACE}" -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)
          SECRET_KEY=$(oc get secret "${S4_SECRET_NAME}" -n "${S4_NAMESPACE}" -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)
          UI_USERNAME=$(oc get secret "${S4_SECRET_NAME}" -n "${S4_NAMESPACE}" -o jsonpath='{.data.UI_USERNAME}' | base64 -d)
          UI_PASSWORD=$(oc get secret "${S4_SECRET_NAME}" -n "${S4_NAMESPACE}" -o jsonpath='{.data.UI_PASSWORD}' | base64 -d)

          if [[ -z "${ACCESS_KEY}" || -z "${SECRET_KEY}" ]]; then
            echo "S4 secret is missing AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY" >&2
            exit 1
          fi

          echo "Ensure S4 bucket ${S4_BUCKET} exists via ${S4_API_URL}"
          AUTH_REQUIRED=$(curl -sf "${S4_API_URL}/auth/info" | sed -n 's/.*"authRequired"[[:space:]]*:[[:space:]]*\(true\|false\).*/\1/p' || true)
          AUTH_HEADER=()
          if [[ "${AUTH_REQUIRED}" == "true" ]]; then
            TOKEN=$(curl -sf -X POST "${S4_API_URL}/auth/login" \
              -H 'Content-Type: application/json' \
              -d "{\"username\":\"${UI_USERNAME}\",\"password\":\"${UI_PASSWORD}\"}" \
              | sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            if [[ -z "${TOKEN}" ]]; then
              echo "Failed to obtain S4 API token" >&2
              exit 1
            fi
            AUTH_HEADER=(-H "Authorization: Bearer ${TOKEN}")
          fi
          HTTP_CODE=$(curl -s -o /tmp/s4-bucket-create.json -w '%{http_code}' \
            -X POST "${S4_API_URL}/buckets" \
            -H 'Content-Type: application/json' \
            "${AUTH_HEADER[@]}" \
            -d "{\"bucketName\":\"${S4_BUCKET}\"}")
          if [[ "${HTTP_CODE}" != "200" && "${HTTP_CODE}" != "409" ]]; then
            echo "Failed to create S4 bucket ${S4_BUCKET} (HTTP ${HTTP_CODE}): $(cat /tmp/s4-bucket-create.json)" >&2
            exit 1
          fi
          echo "S4 bucket ${S4_BUCKET} ready (HTTP ${HTTP_CODE})"

          INSECURE_LINE="false"
          if [[ "${S4_INSECURE}" == "true" ]]; then
            INSECURE_LINE="true"
          fi

          echo "Apply thanos object storage configuration (endpoint ${S4_ENDPOINT}, bucket ${S4_BUCKET})"
          THANOS_YAML=$(printf '%s\n' \
            'type: s3' \
            'config:' \
            "  bucket: ${S4_BUCKET}" \
            "  endpoint: ${S4_ENDPOINT}" \
            "  insecure: ${INSECURE_LINE}" \
            "  access_key: ${ACCESS_KEY}" \
            "  secret_key: ${SECRET_KEY}")
          oc create secret generic thanos-object-storage \
            -n open-cluster-management-observability \
            --from-literal=thanos.yaml="${THANOS_YAML}" \
            --dry-run=client -o yaml | oc apply -f -

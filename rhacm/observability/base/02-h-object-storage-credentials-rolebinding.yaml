# Bind observability-setup SA to the credentials Role.
# Namespace must match OBJSTORE_NAMESPACE in 01-object-storage-config.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observability-setup-object-storage-credentials
  namespace: s4
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observability-setup-object-storage-credentials
subjects:
- kind: ServiceAccount
  name: observability-setup
  namespace: open-cluster-management-observability

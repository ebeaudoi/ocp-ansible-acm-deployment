# S4 connection settings for Thanos object storage.
# Deploy S4 first (s4/deploy-s4.yaml). Endpoint uses the in-cluster Service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: s4-thanos-config
  namespace: open-cluster-management-observability
  labels:
    app.kubernetes.io/name: multicluster-observability
    app.kubernetes.io/component: thanos-config
data:
  S4_NAMESPACE: s4
  S4_SECRET_NAME: s4-credentials
  # In-cluster S3 API (Service s4, port 7480)
  S4_ENDPOINT: s4.s4.svc:7480
  S4_BUCKET: acm-observability
  S4_INSECURE: "true"
  # S4 management API used to ensure the bucket exists
  S4_API_URL: http://s4.s4.svc:5000/api

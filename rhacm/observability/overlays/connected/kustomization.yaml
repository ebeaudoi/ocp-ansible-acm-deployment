apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
- target:
    kind: Job
    name: observability-setup
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: registry.redhat.io/openshift4/ose-cli-rhel9:latest

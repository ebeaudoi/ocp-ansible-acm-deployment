apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/manual-approval

patches:
- target:
    kind: Subscription
    name: .*
  patch: |-
    - op: replace
      path: /spec/channel
      value: release-2.12
    - op: replace
      path: /spec/source
      value: ebdn-redhat-operators

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Connected clusters use Automatic InstallPlan approval (base default).
# Do not include components/manual-approval.

patches:
- target:
    kind: Subscription
    name: .*
  patch: |-
    - op: replace
      path: /spec/channel
      value: release-2.17
    - op: replace
      path: /spec/source
      value: redhat-operators
